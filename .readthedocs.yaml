# Read the Docs configuration. Paths are relative to repository root.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - doxygen
  jobs:
    pre_build:
      - doxygen doc/Doxyfile

sphinx:
  configuration: doc/conf.py
  fail_on_warning: true

search:
  ranking:
    tutorials/*: 3
    usage/*: 2
    api/*: 1
    architecture/*: -2

python:
  install:
    - requirements: doc/requirements.txt
    - method: pip
      path: sdks/python
