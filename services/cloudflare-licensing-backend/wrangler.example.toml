name = "licensecc-online-verifier"
main = "src/index.ts"
compatibility_date = "2026-06-03"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true
preview_urls = false

# Cron Trigger: the scheduled() handler runs protected-device cleanup, device_bound_denials
# retention, portal OTP and session sweeps, webhook delivery and the audit digest.
[triggers]
crons = ["*/5 * * * *"]

[vars]
# Protected device v2 stays closed until explicitly configured. See the README's
# protected-device API section for BOUND_DEVICE_CONFIG (registry, fixed issuer/audience).
# Dedicated Worker secret: BOUND_LEASE_SIGNING_PRIVATE_KEY_PKCS8_PEM.
# Separate consent recovery secret: BOUND_APPROVAL_ENCRYPTION_KEYS (JSON key ring).
# Matching public configuration: BOUND_LEASE_SIGNING_PUBLIC_KEY_SPKI_PEM.
# Protected deploy configs must set BOUND_DEVICE_CONFIG and the public key in [vars];
# /health answers 503 protected_device_ready:false until all four values are valid.
# --- Slice 1 order-ingest (POST /v1/orders): signed, exactly-once subscription fulfillment ---
# Always enforced: HMAC verify (reject unsigned/replayed) and signer-scope authorization
# (deny a signer outside ORDER_SIGNER_SCOPES, a required secret below). No rollout selector.
# Audience folded into the signed bytes to block cross-environment replay (e.g. prod/staging).
# MUST be non-empty (asserted at verify time, fail-closed).
ORDER_INGEST_AUDIENCE = "prod"
# Accepted clock skew (seconds) for the signed X-LCC-Timestamp; default 300, hard cap 3600.
ORDER_MAX_SKEW_SECONDS = "300"
# Protected-device global fuse (requests/minute across all sources); counts only
# traffic already admitted by its own per-source budget. Default 1000, range 100..1000000.
# BOUND_GLOBAL_RATE_LIMIT = "1000"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[[d1_databases]]
binding = "DB"
database_name = "licensecc-online-verifier"
database_id = "replace-with-d1-database-id"
migrations_dir = "migrations"

# Per-source edge limit for POST /v2/device-authorizations registration. Rejects
# floods before any D1 write. Keep >= the D1 per-registration budget (20/min).
[[ratelimits]]
name = "BOUND_REGISTRATION_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Per-source edge limit for /v2 challenge, exchange and renew traffic. Rejects
# floods before any D1 write. Keep >= the D1 per-client budget (600/min).
[[ratelimits]]
name = "BOUND_SESSION_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 600, period = 60 }

# Set these as Worker secrets, not plaintext vars:
# Order-ingest HMAC key map: a JSON object { "<key_id>": "<base64-secret>" }; each secret
# decodes to >= 32 bytes. The map is asserted non-empty / well-formed at verify time
# (fail-closed). Rotate by adding a new key_id before retiring the old.
# wrangler secret put ORDER_HMAC_SECRETS
# Order-signer scope map, MANDATORY: a JSON object { "<key_id>": { "project"?: "<p>",
# "customer_id"?: "<c>" } } with at least one constraint per key id in ORDER_HMAC_SECRETS.
# Missing or malformed fails every order closed with 503 config_error; a signer outside
# its declared scope is refused with 403 signer_scope_forbidden.
# wrangler secret put ORDER_SIGNER_SCOPES
# Webhook signing key map: a JSON object { "<key_id>": "<base64-secret>" }; each secret decodes to
# >= 32 bytes (fail-closed; mirrors ORDER_HMAC_SECRETS). The cron-drained webhook dispatcher signs
# each delivery HMAC-SHA256 over "<t>.<rawjsonbody>" and sends header
#   Licensecc-Signature: t=<epoch>,keyid=<id>,v1=<hex>
# Receivers MUST enforce a 5-minute replay window on t. With no usable secret / missing active key the
# dispatcher logs + SKIPS delivery (never sends unsigned). No per-endpoint secret is stored in D1.
# wrangler secret put WEBHOOK_SIGNING_SECRETS
# WEBHOOK_SIGNING_KEY_ID names the active key (a key in WEBHOOK_SIGNING_SECRETS) that signs deliveries.
# The protected secret inventory requires it as a Worker secret, and the deploy materializer
# refuses it in [vars].
# wrangler secret put WEBHOOK_SIGNING_KEY_ID
