[project]
name = "licensecc"
version = "0.1.0rc3"
description = "Python client SDK for licensecc: offline verification of lcccfg1 config-attestation tokens."
readme = "README.md"
requires-python = ">=3.9.2"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "licensecc" }]
keywords = ["licensing", "license", "verification", "rsa", "token", "licensecc"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries",
]

# Zero hard dependencies beyond `cryptography`.
dependencies = [
    "cryptography>=50.0.2",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3; python_version >= '3.10'"]

[project.urls]
Homepage = "https://github.com/lyehe/licensecc"
Source = "https://github.com/lyehe/licensecc"
Issues = "https://github.com/lyehe/licensecc/issues"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/licensecc"]

[tool.hatch.build.targets.sdist]
# uv.lock is intentionally gitignored for local SDK workflows, so force it
# into the source distribution to keep the release payload platform-neutral.
artifacts = ["uv.lock"]

[dependency-groups]
dev = ["pytest>=9.0.3; python_version >= '3.10'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
