name: Staging public-verifier capacity evidence

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type run-staging-capacity to authorize a protected staging load run
        required: true
        type: string
      mode:
        description: Acceptance profile; rehearsal is intentionally unavailable
        required: true
        type: choice
        options:
          - burst
          - soak
      peak_rps:
        description: Declared peak request rate P
        required: true
        type: string
      max_concurrency:
        description: Maximum in-flight request count for the load runner
        required: true
        type: string
      backend_deployment_id:
        description: Exact staging backend deployment ID from the matching deploy evidence
        required: true
        type: string
      backend_version_id:
        description: Exact sole active staging backend version UUID from the matching deploy evidence
        required: true
        type: string
      operator_attested_commit_sha:
        description: Operator-attested commit.txt SHA from the matching staging deployment artifact
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: licensecc-staging-operations
  cancel-in-progress: false

jobs:
  capacity:
    if: inputs.confirmation == 'run-staging-capacity' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Bind checkout to workflow commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Select npm 10.9.8
        run: |
          npm install --global npm@10.9.8 --no-audit --no-fund
          test "$(npm --version)" = "10.9.8"
      - name: Install locked workspace
        run: npm ci
      - name: Materialize and bind protected staging topology
        env:
          LICENSECC_BACKEND_WRANGLER_CONFIG_B64: ${{ secrets.LICENSECC_BACKEND_WRANGLER_CONFIG_B64 }}
          LICENSECC_ADMIN_WRANGLER_CONFIG_B64: ${{ secrets.LICENSECC_ADMIN_WRANGLER_CONFIG_B64 }}
          LICENSECC_PORTAL_WRANGLER_CONFIG_B64: ${{ secrets.LICENSECC_PORTAL_WRANGLER_CONFIG_B64 }}
          LICENSECC_BACKUP_WRANGLER_CONFIG_B64: ${{ secrets.LICENSECC_BACKUP_WRANGLER_CONFIG_B64 }}
          LICENSECC_EXPECTED_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LICENSECC_EXPECTED_D1_DATABASE_ID: ${{ vars.LICENSECC_D1_DATABASE_ID }}
          LICENSECC_EXPECTED_BACKEND_CREDENTIAL_ORIGIN: ${{ vars.LICENSECC_CAPACITY_URL }}
        run: node scripts/materialize-deploy-configs.mjs --profile staging
      - name: Validate capacity harness
        run: npm run test:capacity --workspace @licensecc/cloudflare-licensing-backend
      - name: Validate declared load and protected staging inputs
        env:
          CAPACITY_MODE: ${{ inputs.mode }}
          CAPACITY_PEAK_RPS: ${{ inputs.peak_rps }}
          CAPACITY_MAX_CONCURRENCY: ${{ inputs.max_concurrency }}
          CAPACITY_BACKEND_DEPLOYMENT_ID: ${{ inputs.backend_deployment_id }}
          CAPACITY_BACKEND_VERSION_ID: ${{ inputs.backend_version_id }}
          CAPACITY_OPERATOR_ATTESTED_COMMIT_SHA: ${{ inputs.operator_attested_commit_sha }}
          LICENSECC_CAPACITY_URL: ${{ vars.LICENSECC_CAPACITY_URL }}
          LICENSECC_CAPACITY_PROJECT: ${{ vars.LICENSECC_CAPACITY_PROJECT }}
          LICENSECC_CAPACITY_FEATURE: ${{ vars.LICENSECC_CAPACITY_FEATURE }}
          LICENSECC_CAPACITY_FINGERPRINT: ${{ secrets.LICENSECC_CAPACITY_FINGERPRINT }}
          LICENSECC_CAPACITY_DEVICE_HASH: ${{ secrets.LICENSECC_CAPACITY_DEVICE_HASH }}
          LICENSECC_CAPACITY_DEVICE_PRIVATE_KEY_PKCS8_PEM: ${{ secrets.LICENSECC_CAPACITY_DEVICE_PRIVATE_KEY_PKCS8_PEM }}
          LICENSECC_CAPACITY_DEVICE_KEY_ID: ${{ secrets.LICENSECC_CAPACITY_DEVICE_KEY_ID }}
        run: |
          node --input-type=module -e '
            const decimal = /^(?:0|[1-9]\d*)(?:\.\d+)?$/u;
            const peakText = process.env.CAPACITY_PEAK_RPS ?? "";
            const concurrencyText = process.env.CAPACITY_MAX_CONCURRENCY ?? "";
            const peak = Number(peakText);
            const concurrency = Number(concurrencyText);
            const deploymentId = process.env.CAPACITY_BACKEND_DEPLOYMENT_ID ?? "";
            const versionId = process.env.CAPACITY_BACKEND_VERSION_ID ?? "";
            const operatorAttestedCommit = process.env.CAPACITY_OPERATOR_ATTESTED_COMMIT_SHA ?? "";
            let target;
            try { target = new URL(process.env.LICENSECC_CAPACITY_URL ?? ""); } catch { target = null; }
            const project = process.env.LICENSECC_CAPACITY_PROJECT ?? "";
            const feature = process.env.LICENSECC_CAPACITY_FEATURE ?? "";
            const fingerprint = process.env.LICENSECC_CAPACITY_FINGERPRINT ?? "";
            const deviceHash = process.env.LICENSECC_CAPACITY_DEVICE_HASH ?? "";
            const privateKey = process.env.LICENSECC_CAPACITY_DEVICE_PRIVATE_KEY_PKCS8_PEM ?? "";
            const deviceKeyId = process.env.LICENSECC_CAPACITY_DEVICE_KEY_ID ?? "";
            const privateKeyBegin = ["-----BEGIN ", "PRIVATE KEY-----"].join("");
            const privateKeyEnd = ["-----END ", "PRIVATE KEY-----"].join("");
            const valid =
              (process.env.CAPACITY_MODE === "burst" || process.env.CAPACITY_MODE === "soak") &&
              peakText.length <= 32 && decimal.test(peakText) && Number.isFinite(peak) && peak > 0 && peak <= 5000 &&
              /^\d{1,3}$/u.test(concurrencyText) && Number.isInteger(concurrency) && concurrency >= 1 && concurrency <= 512 &&
              /^[A-Za-z0-9_-]{1,128}$/u.test(deploymentId) &&
              /^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$/u.test(versionId) &&
              /^[0-9a-f]{40}$/u.test(operatorAttestedCommit) && operatorAttestedCommit === process.env.GITHUB_SHA &&
              target !== null && target.protocol === "https:" && target.username === "" && target.password === "" &&
              /^[A-Za-z0-9_.:-]{1,127}$/u.test(project) &&
              /^[A-Za-z0-9_.:-]{1,15}$/u.test(feature) &&
              /^[0-9a-fA-F]{64}$/u.test(fingerprint) &&
              (deviceHash === "" || /^[0-9a-fA-F]{64}$/u.test(deviceHash)) &&
              privateKey.length > 0 && privateKey.length <= 16384 &&
              privateKey.includes(privateKeyBegin) &&
              privateKey.includes(privateKeyEnd) &&
              /^sha256:[0-9a-f]{64}$/u.test(deviceKeyId) &&
              /^[0-9a-f]{40}$/iu.test(process.env.GITHUB_SHA ?? "");
            if (!valid) throw new Error("protected staging capacity configuration is invalid");
          '
      - name: Bind credentials and load to the approved active backend deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CAPACITY_BACKEND_DEPLOYMENT_ID: ${{ inputs.backend_deployment_id }}
          CAPACITY_BACKEND_VERSION_ID: ${{ inputs.backend_version_id }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/licensecc-capacity-evidence"
          node scripts/run-protected-wrangler.mjs --operation deployments --worker backend \
            | node scripts/assert-worker-deployment.mjs --expected-deployment-id "$CAPACITY_BACKEND_DEPLOYMENT_ID" --expected-version-id "$CAPACITY_BACKEND_VERSION_ID" \
            > "$RUNNER_TEMP/licensecc-capacity-evidence/backend-before.json"
      - name: Run capacity harness and normalize evidence
        id: capacity-run
        env:
          LICENSECC_CAPACITY_MODE: ${{ inputs.mode }}
          LICENSECC_CAPACITY_PEAK_RPS: ${{ inputs.peak_rps }}
          LICENSECC_CAPACITY_MAX_CONCURRENCY: ${{ inputs.max_concurrency }}
          LICENSECC_CAPACITY_ENVIRONMENT: staging
          LICENSECC_RELEASE_COMMIT: ${{ github.sha }}
          CAPACITY_OPERATOR_ATTESTED_COMMIT_SHA: ${{ inputs.operator_attested_commit_sha }}
          LICENSECC_CAPACITY_URL: ${{ vars.LICENSECC_CAPACITY_URL }}
          LICENSECC_CAPACITY_PROJECT: ${{ vars.LICENSECC_CAPACITY_PROJECT }}
          LICENSECC_CAPACITY_FEATURE: ${{ vars.LICENSECC_CAPACITY_FEATURE }}
          LICENSECC_CAPACITY_FINGERPRINT: ${{ secrets.LICENSECC_CAPACITY_FINGERPRINT }}
          LICENSECC_CAPACITY_DEVICE_HASH: ${{ secrets.LICENSECC_CAPACITY_DEVICE_HASH }}
          LICENSECC_CAPACITY_DEVICE_PRIVATE_KEY_PKCS8_PEM: ${{ secrets.LICENSECC_CAPACITY_DEVICE_PRIVATE_KEY_PKCS8_PEM }}
          LICENSECC_CAPACITY_DEVICE_KEY_ID: ${{ secrets.LICENSECC_CAPACITY_DEVICE_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/licensecc-capacity-evidence"
          set +e
          npm --silent run capacity:public-verifier --workspace @licensecc/cloudflare-licensing-backend > "$RUNNER_TEMP/licensecc-capacity-evidence/evidence.json"
          capacity_status="$?"
          set -e
          CAPACITY_COMMAND_STATUS="$capacity_status" node --input-type=module -e '
            import { appendFileSync, readFileSync, writeFileSync } from "node:fs";
            const path = process.env.RUNNER_TEMP + "/licensecc-capacity-evidence/evidence.json";
            const deploymentPath = process.env.RUNNER_TEMP + "/licensecc-capacity-evidence/backend-before.json";
            const commandStatus = Number(process.env.CAPACITY_COMMAND_STATUS);
            let evidence = null;
            let targetBinding = null;
            try { evidence = JSON.parse(readFileSync(path, "utf8")); } catch {}
            try { targetBinding = JSON.parse(readFileSync(deploymentPath, "utf8")); } catch {}
            const valid =
              evidence !== null &&
              targetBinding?.schema_version === 1 &&
              targetBinding?.worker === "backend" &&
              typeof targetBinding?.deployment?.deployment_id === "string" &&
              targetBinding?.deployment?.versions?.length === 1 &&
              targetBinding?.deployment?.versions?.[0]?.percentage === 100 &&
              evidence.schema_version === "licensecc.public-verifier-capacity.evidence.v1" &&
              evidence.gate === "PRD-05" &&
              evidence.gate_completion === "partial_evidence_only" &&
              evidence.exact_commit_sha === process.env.GITHUB_SHA &&
              evidence.operating_environment === "staging" &&
              evidence.run_type === process.env.LICENSECC_CAPACITY_MODE &&
              evidence.acceptance_eligible === true &&
              evidence.target === "<redacted>" &&
              evidence.request_profile?.fingerprint === "<redacted>" &&
              evidence.request_profile?.payload === "<redacted>" &&
              Array.isArray(evidence.failures);
            const runUrl = "https://github.com/" + process.env.GITHUB_REPOSITORY + "/actions/runs/" + process.env.GITHUB_RUN_ID;
            const normalized = valid
              ? {
                  ...evidence,
                  workflow_attestation: {
                    workflow: ".github/workflows/capacity.yml",
                    run_url: runUrl,
                    workflow_sha: process.env.GITHUB_SHA,
                    harness_command_status: commandStatus,
                  },
                  target_binding: {
                    worker: "backend",
                    deployment_id: targetBinding.deployment.deployment_id,
                    version_id: targetBinding.deployment.versions[0].version_id,
                    operator_attested_commit_sha: process.env.CAPACITY_OPERATOR_ATTESTED_COMMIT_SHA,
                    deployment_created_at: targetBinding.deployment.created_on,
                    stable_during_run: false,
                  },
                }
              : {
                  schema_version: "licensecc.public-verifier-capacity.workflow-evidence.v1",
                  gate: "PRD-05",
                  evidence_scope: "public_verifier_capacity_workflow",
                  gate_completion: "partial_evidence_only",
                  generated_at_utc: new Date().toISOString(),
                  exact_commit_sha: process.env.GITHUB_SHA,
                  operating_environment: "staging",
                  run_type: process.env.LICENSECC_CAPACITY_MODE,
                  acceptance_eligible: false,
                  verdict: "harness_error",
                  target: "<redacted>",
                  harness_command_status: commandStatus,
                  harness_evidence_valid: false,
                  workflow_run_url: runUrl,
                };
            writeFileSync(path, JSON.stringify(normalized, null, 2) + "\n", { mode: 0o600 });
            const effectiveStatus = commandStatus === 0 && valid && evidence.verdict === "pass" ? 0 : (commandStatus === 0 ? 1 : commandStatus);
            appendFileSync(process.env.GITHUB_OUTPUT, "exit_code=" + effectiveStatus + "\n");
          '
      - name: Confirm the approved backend deployment stayed active
        if: ${{ always() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CAPACITY_BACKEND_DEPLOYMENT_ID: ${{ inputs.backend_deployment_id }}
          CAPACITY_BACKEND_VERSION_ID: ${{ inputs.backend_version_id }}
        run: |
          set -o pipefail
          node scripts/run-protected-wrangler.mjs --operation deployments --worker backend \
            | node scripts/assert-worker-deployment.mjs --expected-deployment-id "$CAPACITY_BACKEND_DEPLOYMENT_ID" --expected-version-id "$CAPACITY_BACKEND_VERSION_ID" \
            > "$RUNNER_TEMP/licensecc-capacity-evidence/backend-after.json"
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const directory = process.env.RUNNER_TEMP + "/licensecc-capacity-evidence/";
            const evidence = JSON.parse(readFileSync(directory + "evidence.json", "utf8"));
            const before = JSON.parse(readFileSync(directory + "backend-before.json", "utf8"));
            const after = JSON.parse(readFileSync(directory + "backend-after.json", "utf8"));
            if (
              evidence?.target_binding?.deployment_id !== before?.deployment?.deployment_id
              || evidence?.target_binding?.version_id !== before?.deployment?.versions?.[0]?.version_id
              || before?.deployment?.deployment_id !== after?.deployment?.deployment_id
              || before?.deployment?.versions?.[0]?.version_id !== after?.deployment?.versions?.[0]?.version_id
            ) throw new Error("capacity target deployment changed during the run");
            evidence.target_binding.stable_during_run = true;
            writeFileSync(directory + "evidence.json", JSON.stringify(evidence, null, 2) + "\n", { mode: 0o600 });
          '
      - name: Retain redacted capacity evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-capacity-${{ inputs.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/licensecc-capacity-evidence/evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce capacity verdict
        if: ${{ always() }}
        env:
          CAPACITY_EXIT_CODE: ${{ steps.capacity-run.outputs.exit_code }}
        run: test "$CAPACITY_EXIT_CODE" = "0"
