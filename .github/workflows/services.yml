name: Services CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  services:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Select npm 10.9.8
        run: |
          npm install --global npm@10.9.8 --no-audit --no-fund
          test "$(npm --version)" = "10.9.8"
      - name: Install root workspace
        run: npm ci
      - name: Service, schema, and contract gates
        run: |
          npm run scan:secrets
          npm run lint
          npm run typecheck
          npm run check:architecture
          npm run test:contracts
          npm run test:services
      - name: Credential-free Worker dry-runs
        run: npm run check:dry-run

  sdks:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17.0.20+8"
      - name: Select npm 10.9.8
        run: |
          npm install --global npm@10.9.8 --no-audit --no-fund
          test "$(npm --version)" = "10.9.8"
      - name: Install root workspace
        run: npm ci
      - name: Python, .NET, and Java SDK tests
        run: npm run test:sdks

  e2e:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Select npm 10.9.8
        run: |
          npm install --global npm@10.9.8 --no-audit --no-fund
          test "$(npm --version)" = "10.9.8"
      - name: Install root workspace
        run: npm ci
      # Admin stays on Playwright 1.60 while the portal stays on 1.61; those
      # releases require different Chromium revisions. This is the one dedicated
      # browser setup step, and no test script installs browsers.
      - name: Install retained Playwright Chromium revisions
        run: npm run setup:browsers
      - name: Browser end-to-end tests
        run: npm run test:e2e

  documentation:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Select npm 10.9.8
        run: |
          npm install --global npm@10.9.8 --no-audit --no-fund
          test "$(npm --version)" = "10.9.8"
      - name: Install root workspace
        run: npm ci
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Strict Doxygen and Sphinx build
        run: npm run check:docs

  linkcheck:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Select npm 10.9.8
        run: |
          npm install --global npm@10.9.8 --no-audit --no-fund
          test "$(npm --version)" = "10.9.8"
      - name: Install root workspace
        run: npm ci
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Strict link checker
        run: npm run check:docs:links
