name: Publish platform release

on:
  push:
    tags:
      - "platform-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.8"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.18"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.423"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17.0.20+8"
      - name: Select npm 10.9.8
        run: |
          npm install --global npm@10.9.8 --no-audit --no-fund
          test "$(npm --version)" = "10.9.8"
      - name: Install release verifier toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev \
            libboost-dev libboost-test-dev libboost-filesystem-dev \
            libboost-iostreams-dev libboost-program-options-dev \
            libboost-system-dev libboost-thread-dev libboost-date-time-dev
      - name: Bind tag to version authority
        run: node scripts/check-release-tag.mjs "$GITHUB_REF_NAME"
      - name: Install locked workspace
        run: npm ci
      - name: Run platform release gates
        run: |
          npm run check:pr
          npm run test:sdks
          npm run check:dry-run
      - name: Assemble and compare canonical release payloads
        run: >-
          node scripts/assemble-release-artifacts.mjs
          --output "$RUNNER_TEMP/licensecc-platform-release"
          --repeat-output "$RUNNER_TEMP/licensecc-platform-release-repeat"
          --consumer-id release-candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-release
          path: ${{ runner.temp }}/licensecc-platform-release
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-release
          path: release
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: release/python

  publish-nuget:
    needs: build
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-release
          path: release
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.423"
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish NuGet package
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push release/dotnet/*.nupkg
          --api-key "$NUGET_API_KEY"
          --source https://www.nuget.org/api/v2/package

  github-release:
    needs: [build, publish-pypi, publish-nuget]
    runs-on: ubuntu-latest
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-release
          path: release
      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find release/python release/dotnet release/java release/cpp -type f -print0 | sort -z)
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --generate-notes "${prerelease[@]}" \
            release/checksums.sha256 release/release-manifest.json release/spdx.json "${assets[@]}"
