name: Linux_CI
on: [push, pull_request]

permissions:
   contents: read

jobs:
   build-linux-arm64:
      runs-on: ubuntu-24.04-arm
      steps:
      -  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -  name: Assert native ARM64 runner
         run: test "$(uname -m)" = "aarch64"
      -  name: Install dependencies
         run: |
            sudo apt-get update
            sudo apt-get install -y cmake libssl-dev libcurl4-openssl-dev zlib1g-dev \
              libboost-dev libboost-test-dev libboost-filesystem-dev \
              libboost-iostreams-dev libboost-program-options-dev \
              libboost-system-dev libboost-thread-dev libboost-date-time-dev \
              valgrind
      -  name: Bootstrap preflight
         run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap.ps1 -CheckOnly
      -  name: Native ARM64 build purity and tests
         run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/check-build-purity.ps1 -Preset ci-linux-arm64

   build-linux:
      runs-on: ubuntu-latest
      strategy:
        fail-fast: false
        matrix:
          preset: ["ci-linux-debug", "ci-linux-release", "ci-linux-device-identity-test", "dev-device-identity-off"]

      steps:
      -  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -  name: Install dependencies
         run: |
            sudo apt-get update
            sudo apt-get install -y cmake libssl-dev libcurl4-openssl-dev zlib1g-dev \
              libboost-dev libboost-test-dev libboost-filesystem-dev \
              libboost-iostreams-dev libboost-program-options-dev \
              libboost-system-dev libboost-thread-dev libboost-date-time-dev \
              valgrind
      -  name: Bootstrap preflight
         run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap.ps1 -CheckOnly
      -  name: Core build purity
         run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/check-build-purity.ps1 -Preset ${{ matrix.preset }}
      -  name: Verify disabled device APIs are absent
         if: matrix.preset == 'dev-device-identity-off'
         run: |
            nm -g --defined-only build/dev-device-identity-off/src/library/liblicensecc_static.a > build/dev-device-identity-off/defined-symbols.txt
            if grep -Eq '[[:space:]]lcc_(init_)?(feature_session|device_bound|device_identity)_' build/dev-device-identity-off/defined-symbols.txt; then
               echo "Disabled device APIs must not be exported"
               exit 1
            fi
      -  name: Offline documentation quickstart
         if: matrix.preset == 'ci-linux-debug'
         run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci/run-offline-docs-quickstart.ps1
      -  name: Exact device-identity suite
         if: matrix.preset == 'ci-linux-device-identity-test'
         run: ctest --preset ci-linux-device-identity-test --no-tests=error -R "^device_identity_(abi|vectors|policy|concurrency)_test$"
      -  name: Install device-identity package
         if: matrix.preset == 'ci-linux-device-identity-test'
         run: cmake --install build/ci-linux-device-identity-test --prefix build/ci-linux-device-identity-test/install
      -  name: Installed C99 and C++ device-identity consumer
         if: matrix.preset == 'ci-linux-device-identity-test'
         run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci/run-installed-device-identity-consumer.ps1 -InstallPrefix build/ci-linux-device-identity-test/install -RequireC99
      -  name: On failure print logs
         if: ${{ failure() }}
         run: cat /tmp/open-license.log || true

   build-linux-tpm2-capability:
      runs-on: ${{ matrix.os }}
      strategy:
        fail-fast: false
        matrix:
          include:
            - os: ubuntu-22.04
              preset: ci-linux-debug-tpm2-capability
            - os: ubuntu-22.04
              preset: ci-linux-release-tpm2-capability
            - os: ubuntu-24.04
              preset: ci-linux-debug-tpm2-capability
            - os: ubuntu-24.04
              preset: ci-linux-release-tpm2-capability

      steps:
      -  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -  name: Install dependencies
         run: |
            sudo apt-get update
            sudo apt-get install -y software-properties-common
            sudo add-apt-repository --yes universe
            sudo apt-get update
            sudo apt-get install -y cmake libssl-dev libcurl4-openssl-dev zlib1g-dev \
              libboost-dev libboost-test-dev libboost-filesystem-dev \
              libboost-iostreams-dev libboost-program-options-dev \
              libboost-system-dev libboost-thread-dev libboost-date-time-dev \
              valgrind tpm2-openssl tpm2-tools swtpm
      -  name: Record TPM2 package and provider versions
         run: |
            dpkg-query -W -f='${binary:Package} ${Version}\n' tpm2-openssl tpm2-tools swtpm libtss2-esys-3.0.2 || true
            openssl version -a
      -  name: Bootstrap preflight
         run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap.ps1 -CheckOnly
      -  name: Capability build purity
         run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/check-build-purity.ps1 -Preset ${{ matrix.preset }}
      -  name: OpenSSL TPM2 exact-digest simulator capability
         run: scripts/ci/run-swtpm-device-identity.sh build/${{ matrix.preset }}
      -  name: On failure print simulator logs
         if: ${{ failure() }}
         run: find build/${{ matrix.preset }} -name swtpm.log -type f -print -exec cat {} \; || true

   build-linux-tpm2:
      runs-on: ${{ matrix.os }}
      strategy:
        fail-fast: false
        matrix:
          include:
            - os: ubuntu-22.04
              preset: ci-linux-debug-tpm2
              configuration: Debug
            - os: ubuntu-22.04
              preset: ci-linux-release-tpm2
              configuration: Release
            - os: ubuntu-24.04
              preset: ci-linux-debug-tpm2
              configuration: Debug
            - os: ubuntu-24.04
              preset: ci-linux-release-tpm2
              configuration: Release

      steps:
      -  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -  name: Install dependencies
         run: |
            sudo apt-get update
            sudo apt-get install -y software-properties-common
            sudo add-apt-repository --yes universe
            sudo apt-get update
            sudo apt-get install -y cmake libssl-dev libcurl4-openssl-dev zlib1g-dev \
              libboost-dev libboost-test-dev libboost-filesystem-dev \
              libboost-iostreams-dev libboost-program-options-dev \
              libboost-system-dev libboost-thread-dev libboost-date-time-dev \
              valgrind tpm2-openssl tpm2-tools swtpm
      -  name: Record TPM2 package and provider versions
         run: |
            dpkg-query -W -f='${binary:Package} ${Version}\n' tpm2-openssl tpm2-tools swtpm libtss2-esys-3.0.2 || true
            openssl version -a
      -  name: Bootstrap preflight
         run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap.ps1 -CheckOnly
      -  name: Keep Ubuntu 22 provider-only coverage with its older libcurl
         if: matrix.os == 'ubuntu-22.04'
         run: cmake --preset ${{ matrix.preset }} -DLCC_ENABLE_LINUX_DESKTOP=OFF
      -  name: Production TPM2 build purity
         run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/check-build-purity.ps1 -Preset ${{ matrix.preset }}
      -  name: Exact production TPM2 shim
         run: ctest --preset ${{ matrix.preset }} --no-tests=error -R '^device_identity_tpm2_openssl_shim$'
      -  name: Install TPM2 device-identity package
         run: cmake --install build/${{ matrix.preset }} --prefix build/${{ matrix.preset }}/install
      -  name: OpenSSL TPM2 simulator, installed consumer, and example
         run: scripts/ci/run-swtpm-device-identity.sh build/${{ matrix.preset }} build/${{ matrix.preset }}/install ${{ matrix.configuration }}
      -  name: Node for installed SDK tests
         if: matrix.os == 'ubuntu-24.04' && matrix.configuration == 'Debug'
         uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
         with:
            node-version: 22
      -  name: Python for installed bridge
         if: matrix.os == 'ubuntu-24.04' && matrix.configuration == 'Debug'
         uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      -  name: .NET for installed bridge
         if: matrix.os == 'ubuntu-24.04' && matrix.configuration == 'Debug'
         uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
         with:
            dotnet-version: "8.0.423"
      -  name: Java for installed bridge
         if: matrix.os == 'ubuntu-24.04' && matrix.configuration == 'Debug'
         uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
         with:
            distribution: temurin
            java-version: "17"
      -  name: Linux installed protected SDK bridges
         if: matrix.os == 'ubuntu-24.04' && matrix.configuration == 'Debug'
         run: |
            prefix="$PWD/build/${{ matrix.preset }}/install"
            cmake -S sdks/python/native -B build/linux-python-bridge -DCMAKE_PREFIX_PATH="$prefix"
            cmake --build build/linux-python-bridge -j 4
            export LCC_TEST_DEVICE_BOUND_DLL="$PWD/build/linux-python-bridge/liblicensecc_device_bound_bridge.so"
            nm -D --defined-only "$LCC_TEST_DEVICE_BOUND_DLL" | awk '{print $3}' | sort > build/linux-bridge-exports.txt
            awk '/^[ ]+lcc_/ {print $1}' sdks/python/native/bridge.def | sort > build/linux-bridge-expected.txt
            diff -u build/linux-bridge-expected.txt build/linux-bridge-exports.txt
            uv run --directory sdks/python --locked --python 3.12 python -m pytest tests/test_device_bound_bridge.py tests/test_feature_session_bridge.py
            dotnet test sdks/dotnet/test/Licensecc.Client.Tests/Licensecc.Client.Tests.csproj --configuration Release
            cmake -S sdks/java/native -B build/linux-java-bridge -DCMAKE_PREFIX_PATH="$prefix" -DLCC_JNI_BUILD_TESTS=ON
            cmake --build build/linux-java-bridge -j 4
            export LCC_TEST_DEVICE_BOUND_JNI_DLL="$PWD/build/linux-java-bridge/liblicensecc_device_bound_jni.so"
            export LCC_TEST_BAD_JNI_DLL="$PWD/build/linux-java-bridge/liblicensecc_device_bound_jni_bad.so"
            export LCC_TEST_JNI_FIXTURE_DLL="$PWD/build/linux-java-bridge/liblicensecc_device_bound_jni_fixture.so"
            node scripts/test-java-sdk.mjs
      -  name: On failure print simulator logs
         if: ${{ failure() }}
         run: find build/${{ matrix.preset }} -name swtpm.log -type f -print -exec cat {} \; || true
