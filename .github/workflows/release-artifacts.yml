name: Release artifact dry-run

on:
  workflow_dispatch:
    inputs:
      consumer_id:
        description: Consumer identifier to label the source-only C++ archive
        required: true
        default: release-candidate
        type: string

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.423"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17.0.20+8"
      - name: Select npm 10.9.8
        run: |
          npm install --global npm@10.9.8 --no-audit --no-fund
          test "$(npm --version)" = "10.9.8"
      - name: Install no-install verifier toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev zlib1g-dev \
            libboost-dev libboost-test-dev libboost-filesystem-dev \
            libboost-iostreams-dev libboost-program-options-dev \
            libboost-system-dev libboost-thread-dev libboost-date-time-dev
      - name: Assemble and inspect local release-candidate staging
        env:
          CONSUMER_ID: ${{ inputs.consumer_id }}
        run: >-
          node scripts/assemble-release-artifacts.mjs
          --output "$RUNNER_TEMP/licensecc-release-artifacts"
          --repeat-output "$RUNNER_TEMP/licensecc-release-artifacts-repeat"
          --consumer-id "$CONSUMER_ID"
