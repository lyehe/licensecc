name: Release artifact dry-run

on:
  workflow_dispatch:
    inputs:
      consumer_id:
        description: Consumer identifier to label the source-only C++ archive
        required: true
        default: release-candidate
        type: string

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.8"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.18"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.423"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17.0.20+8"
      - name: Select npm 10.9.8
        run: |
          npm install --global npm@10.9.8 --no-audit --no-fund
          test "$(npm --version)" = "10.9.8"
      - name: Install release tooling dependencies
        run: npm ci
      - name: Install no-install verifier toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev \
            libboost-dev libboost-test-dev libboost-filesystem-dev \
            libboost-iostreams-dev libboost-program-options-dev \
            libboost-system-dev libboost-thread-dev libboost-date-time-dev
      - name: Assemble and inspect local release-candidate staging
        env:
          CONSUMER_ID: ${{ inputs.consumer_id }}
        run: >-
          node scripts/assemble-release-artifacts.mjs
          --output "$RUNNER_TEMP/licensecc-release-artifacts"
          --repeat-output "$RUNNER_TEMP/licensecc-release-artifacts-repeat"
          --consumer-id "$CONSUMER_ID"
