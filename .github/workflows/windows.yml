name: Github_CI
on: [push, pull_request]

permissions:
   contents: read

jobs:
   build-windows:
      runs-on: ${{ matrix.os }}
      strategy:
        fail-fast: false
        max-parallel: 1
        matrix:
          os: ["windows-2022"]
          preset:
            - "ci-windows-msvc-debug-dynamic"
            - "ci-windows-msvc-debug-static"
            - "ci-windows-msvc-release-dynamic"
            - "ci-windows-msvc-release-static"
            - "ci-windows-device-identity-test"

      steps:
      -  uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      -  name: Cache Boost (msvc 14.3 / VS2022)
         id: cache-boost
         uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
         with:
            path: C:\local\boost_1_84_0
            key: boost-msvc-14.3-1.84.0.1-windows-2022
      -  name: Install Boost (msvc 14.3 / VS2022)
         if: steps.cache-boost.outputs.cache-hit != 'true'
         shell: pwsh
         timeout-minutes: 20
         run: |
            $boostVersion = "1.84.0"
            $boostRoot = "C:\local\boost_1_84_0"
            $installer = Join-Path $env:RUNNER_TEMP "boost_1_84_0-msvc-14.3-64.exe"
            $url = "https://archives.boost.io/release/$boostVersion/binaries/boost_1_84_0-msvc-14.3-64.exe"
            $expectedSha256 = "b14090362af9730ed9cc125b456a76d981b010060ee30e6d2eb109f8144fa444"
            curl.exe -L --fail --retry 3 --retry-all-errors --retry-delay 10 --connect-timeout 30 --max-time 600 -o $installer $url
            if ($LASTEXITCODE -ne 0) {
              throw "Boost download failed with curl exit code $LASTEXITCODE"
            }
            $actualSha256 = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
            if ($actualSha256 -ne $expectedSha256) {
              throw "Boost installer SHA256 mismatch: $actualSha256"
            }
            $process = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$boostRoot" -PassThru -WindowStyle Hidden
            if (-not $process.WaitForExit(600000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "Boost installer timed out"
            }
            if ($process.ExitCode -ne 0) {
              throw "Boost installer failed with exit code $($process.ExitCode)"
            }
            if (-not (Test-Path (Join-Path $boostRoot "boost"))) {
              throw "Boost install did not create $boostRoot\boost"
            }
      -  name: Export Boost root
         shell: pwsh
         run: |
            $boostRoot = "C:\local\boost_1_84_0"
            if (-not (Test-Path (Join-Path $boostRoot "boost"))) {
              throw "Boost install missing at $boostRoot"
            }
            "BOOST_ROOT=C:/local/boost_1_84_0" >> $env:GITHUB_ENV
      -  name: Bootstrap preflight
         shell: pwsh
         run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap.ps1 -CheckOnly
      -  name: Core build purity
         shell: pwsh
         run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/check-build-purity.ps1 -Preset ${{ matrix.preset }}
      -  name: Exact device-identity suite
         if: matrix.preset == 'ci-windows-device-identity-test'
         shell: pwsh
         run: ctest --preset ci-windows-device-identity-test --no-tests=error -R "^device_identity_(abi|vectors|policy|concurrency)_test$"
      -  name: Install device-identity package
         if: matrix.preset == 'ci-windows-device-identity-test'
         shell: pwsh
         run: cmake --install build/ci-windows-device-identity-test --config Debug --prefix build/ci-windows-device-identity-test/install
      -  name: Installed C99 and C++ device-identity consumer
         if: matrix.preset == 'ci-windows-device-identity-test'
         shell: pwsh
         run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci/run-installed-device-identity-consumer.ps1 -InstallPrefix build/ci-windows-device-identity-test/install -RequireC99
      -  name: Reject OpenSSL from the Windows identity package
         if: matrix.preset == 'ci-windows-device-identity-test'
         shell: pwsh
         run: |
            $cachePath = "build/ci-windows-device-identity-test/CMakeCache.txt"
            if (-not (Test-Path -LiteralPath $cachePath -PathType Leaf)) {
              throw "Configured CMake cache was not found: $cachePath"
            }
            $linkerEntries = @(
              Get-Content -LiteralPath $cachePath | ForEach-Object {
                if ($_ -match '^CMAKE_LINKER:FILEPATH=(.+)$') { $Matches[1] }
              }
            )
            if ($linkerEntries.Count -ne 1) {
              throw "Expected exactly one CMAKE_LINKER:FILEPATH entry in $cachePath; found $($linkerEntries.Count)"
            }
            $linker = $linkerEntries[0]
            if (-not (Test-Path -LiteralPath $linker -PathType Leaf)) {
              throw "Configured CMAKE_LINKER does not exist: $linker"
            }
            $dumpbin = Join-Path (Split-Path -Parent $linker) "dumpbin.exe"
            if (-not (Test-Path -LiteralPath $dumpbin -PathType Leaf)) {
              throw "dumpbin.exe was not found beside configured CMAKE_LINKER '$linker': $dumpbin"
            }
            $consumer = "build/installed-device-identity-consumer/Debug/device_identity_cpp_link_smoke.exe"
            if (-not (Test-Path -LiteralPath $consumer -PathType Leaf)) {
              throw "Installed consumer executable was not found: $consumer"
            }
            $imports = & $dumpbin /dependents $consumer
            if ($LASTEXITCODE -ne 0) { throw "dumpbin dependency inspection failed" }
            if ($imports -match '(?i)(?:lib)?(?:ssl|crypto)[^\s]*\.dll') { throw "OpenSSL DLL dependency detected" }
            $archive = "build/ci-windows-device-identity-test/src/library/Debug/licensecc_static.lib"
            if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
              throw "Configured licensecc archive was not found: $archive"
            }
            $directives = & $dumpbin /directives $archive
            if ($LASTEXITCODE -ne 0) { throw "dumpbin archive inspection failed" }
            if ($directives -match '(?i)(?:libcrypto|libssl|crypto|ssl)\.lib') { throw "OpenSSL archive directive detected" }
      -  name: Inspector
         shell: bash
         run: ./build/${{ matrix.preset }}/install/bin/test/lccinspector.exe
      -  name: On failure print logs
         if: ${{ failure() }}
         shell: pwsh
         run: Get-Content "$env:temp/open-license.log" -ErrorAction SilentlyContinue
