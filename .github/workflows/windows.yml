name: Github_CI
on: [push, pull_request]

permissions:
   contents: read

jobs:
   build-windows:
      runs-on: ${{ matrix.os }}
      env:
        CMAKE_GENERATOR: ${{ matrix.generator }}
      strategy:
        fail-fast: false
        max-parallel: 1
        matrix:
          include:
            # Protected transport requires WinHTTP's cross-session pooling control.
            - os: "windows-2025-vs2026"
              generator: "Visual Studio 18 2026"
              preset: "ci-windows-device-identity-test"
            - os: "windows-2025-vs2026"
              generator: "Visual Studio 18 2026"
              preset: "ci-windows-msvc-debug-dynamic-tpm"
            - os: "windows-2022"
              generator: "Visual Studio 17 2022"
              preset: "ci-windows-msvc-debug-dynamic"
            - os: "windows-2022"
              generator: "Visual Studio 17 2022"
              preset: "ci-windows-msvc-debug-static"
            - os: "windows-2022"
              generator: "Visual Studio 17 2022"
              preset: "ci-windows-msvc-release-dynamic"
            - os: "windows-2022"
              generator: "Visual Studio 17 2022"
              preset: "ci-windows-msvc-release-static"

      steps:
      -  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -  name: Cache Boost (msvc 14.3 / VS2022)
         id: cache-boost
         uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
         with:
            path: C:\local\boost_1_84_0
            key: boost-msvc-14.3-1.84.0.1-${{ matrix.os }}
      -  name: Install Boost (msvc 14.3 / VS2022)
         if: steps.cache-boost.outputs.cache-hit != 'true'
         shell: pwsh
         timeout-minutes: 20
         run: |
            $boostVersion = "1.84.0"
            $boostRoot = "C:\local\boost_1_84_0"
            $installer = Join-Path $env:RUNNER_TEMP "boost_1_84_0-msvc-14.3-64.exe"
            $url = "https://archives.boost.io/release/$boostVersion/binaries/boost_1_84_0-msvc-14.3-64.exe"
            $expectedSha256 = "b14090362af9730ed9cc125b456a76d981b010060ee30e6d2eb109f8144fa444"
            curl.exe -L --fail --retry 3 --retry-all-errors --retry-delay 10 --connect-timeout 30 --max-time 600 -o $installer $url
            if ($LASTEXITCODE -ne 0) {
              throw "Boost download failed with curl exit code $LASTEXITCODE"
            }
            $actualSha256 = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
            if ($actualSha256 -ne $expectedSha256) {
              throw "Boost installer SHA256 mismatch: $actualSha256"
            }
            $process = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$boostRoot" -PassThru -WindowStyle Hidden
            if (-not $process.WaitForExit(600000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "Boost installer timed out"
            }
            if ($process.ExitCode -ne 0) {
              throw "Boost installer failed with exit code $($process.ExitCode)"
            }
            if (-not (Test-Path (Join-Path $boostRoot "boost"))) {
              throw "Boost install did not create $boostRoot\boost"
            }
      -  name: Export Boost root
         shell: pwsh
         run: |
            $boostRoot = "C:\local\boost_1_84_0"
            if (-not (Test-Path (Join-Path $boostRoot "boost"))) {
              throw "Boost install missing at $boostRoot"
            }
            "BOOST_ROOT=C:/local/boost_1_84_0" >> $env:GITHUB_ENV
      -  name: Bootstrap preflight
         shell: pwsh
         run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap.ps1 -CheckOnly
      -  name: Core build purity
         shell: pwsh
         run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/check-build-purity.ps1 -Preset ${{ matrix.preset }} -Generator "$env:CMAKE_GENERATOR"
      -  name: Exact device-identity suite
         if: matrix.preset == 'ci-windows-device-identity-test'
         shell: pwsh
         run: ctest --preset ci-windows-device-identity-test --no-tests=error -R "^device_identity_(abi|vectors|policy|concurrency)_test$"
      -  name: Install device-identity package
         if: matrix.preset == 'ci-windows-device-identity-test'
         shell: pwsh
         run: cmake --install build/ci-windows-device-identity-test --config Debug --prefix build/ci-windows-device-identity-test/install
      -  name: Installed C99 and C++ device-identity consumer
         if: matrix.preset == 'ci-windows-device-identity-test'
         shell: pwsh
         run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci/run-installed-device-identity-consumer.ps1 -InstallPrefix build/ci-windows-device-identity-test/install -RequireC99
      -  name: Reject OpenSSL from the Windows identity package
         if: matrix.preset == 'ci-windows-device-identity-test'
         shell: pwsh
         run: |
            $cachePath = "build/ci-windows-device-identity-test/CMakeCache.txt"
            if (-not (Test-Path -LiteralPath $cachePath -PathType Leaf)) {
              throw "Configured CMake cache was not found: $cachePath"
            }
            $linkerEntries = @(
              Get-Content -LiteralPath $cachePath | ForEach-Object {
                if ($_ -match '^CMAKE_LINKER:FILEPATH=(.+)$') { $Matches[1] }
              }
            )
            if ($linkerEntries.Count -ne 1) {
              throw "Expected exactly one CMAKE_LINKER:FILEPATH entry in $cachePath; found $($linkerEntries.Count)"
            }
            $linker = $linkerEntries[0]
            if (-not (Test-Path -LiteralPath $linker -PathType Leaf)) {
              throw "Configured CMAKE_LINKER does not exist: $linker"
            }
            $dumpbin = Join-Path (Split-Path -Parent $linker) "dumpbin.exe"
            if (-not (Test-Path -LiteralPath $dumpbin -PathType Leaf)) {
              throw "dumpbin.exe was not found beside configured CMAKE_LINKER '$linker': $dumpbin"
            }
            $consumer = "build/installed-device-identity-consumer/Debug/device_identity_cpp_link_smoke.exe"
            if (-not (Test-Path -LiteralPath $consumer -PathType Leaf)) {
              throw "Installed consumer executable was not found: $consumer"
            }
            $imports = & $dumpbin /dependents $consumer
            if ($LASTEXITCODE -ne 0) { throw "dumpbin dependency inspection failed" }
            if ($imports -match '(?i)(?:lib)?(?:ssl|crypto)[^\s]*\.dll') { throw "OpenSSL DLL dependency detected" }
            $archive = "build/ci-windows-device-identity-test/src/library/Debug/licensecc_static.lib"
            if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
              throw "Configured licensecc archive was not found: $archive"
            }
            $directives = & $dumpbin /directives $archive
            if ($LASTEXITCODE -ne 0) { throw "dumpbin archive inspection failed" }
            if ($directives -match '(?i)(?:libcrypto|libssl|crypto|ssl)\.lib') { throw "OpenSSL archive directive detected" }
      -  name: Inspector
         shell: bash
         run: ./build/${{ matrix.preset }}/install/bin/test/lccinspector.exe
      -  name: Python for installed native bridge
         if: matrix.preset == 'ci-windows-msvc-debug-dynamic-tpm'
         uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
         with:
            python-version: "3.12"
      -  name: uv for installed native bridge
         if: matrix.preset == 'ci-windows-msvc-debug-dynamic-tpm'
         uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
         with:
            version: "0.12.5"
            # Native filesystem tests leave inaccessible junction fixtures in build/.
            cache-dependency-glob: "sdks/python/uv.lock"
      -  name: Installed Python device-bound bridge
         if: matrix.preset == 'ci-windows-msvc-debug-dynamic-tpm'
         shell: pwsh
         timeout-minutes: 10
         run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci/run-installed-python-device-bound.ps1 -Generator "$env:CMAKE_GENERATOR" -InstallPrefix build/ci-windows-msvc-debug-dynamic-tpm/install
      -  name: .NET for installed native bridge
         if: matrix.preset == 'ci-windows-msvc-debug-dynamic-tpm'
         uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
         with:
            dotnet-version: "8.0.423"
      -  name: Installed .NET device-bound bridge
         # Shared installed C bridge is built and export-checked by the Python step above.
         if: matrix.preset == 'ci-windows-msvc-debug-dynamic-tpm'
         shell: pwsh
         timeout-minutes: 10
         run: |
            $env:LCC_TEST_DEVICE_BOUND_DLL = Join-Path $env:GITHUB_WORKSPACE 'build/installed-python-device-bound/installed/bin/licensecc_device_bound_bridge.dll'
            if (-not (Test-Path -LiteralPath $env:LCC_TEST_DEVICE_BOUND_DLL -PathType Leaf)) { throw 'Installed bridge is missing' }
            $env:LCC_TEST_OLD_DEVICE_BOUND_DLL = Join-Path $env:GITHUB_WORKSPACE 'build/installed-python-device-bound/Debug/licensecc_device_bound_original.dll'
            if (-not (Test-Path -LiteralPath $env:LCC_TEST_OLD_DEVICE_BOUND_DLL -PathType Leaf)) { throw 'Original-export fixture is missing' }
            dotnet test sdks/dotnet/Licensecc.Client.sln -p:RestoreLockedMode=true
            if ($LASTEXITCODE -ne 0) { throw 'Installed .NET bridge tests failed' }
      -  name: Java for installed native adapter
         if: matrix.preset == 'ci-windows-msvc-debug-dynamic-tpm'
         uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
         with:
            distribution: temurin
            java-version: "17.0.20+8"
      -  name: Node for installed Java adapter gate
         if: matrix.preset == 'ci-windows-msvc-debug-dynamic-tpm'
         uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
         with:
            node-version: 22
      -  name: Installed Java device-bound adapter
         if: matrix.preset == 'ci-windows-msvc-debug-dynamic-tpm'
         shell: pwsh
         timeout-minutes: 10
         run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci/run-installed-java-device-bound.ps1 -Generator "$env:CMAKE_GENERATOR" -InstallPrefix build/ci-windows-msvc-debug-dynamic-tpm/install
      -  name: Protected application example
         if: matrix.preset == 'ci-windows-msvc-debug-dynamic-tpm'
         shell: pwsh
         timeout-minutes: 10
         run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci/build-device-bound-example.ps1 -InstallPrefix build/ci-windows-msvc-debug-dynamic-tpm/install -BuildDirectory build/ci-windows-msvc-debug-dynamic-tpm-example -Configuration Debug -Generator "$env:CMAKE_GENERATOR"
      -  name: On failure print logs
         if: ${{ failure() }}
         shell: pwsh
         run: Get-Content "$env:temp/open-license.log" -ErrorAction SilentlyContinue
