name: Lint

on: [pull_request]

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting of changed files
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          files=$(git diff --name-only --diff-filter=ACMR "$base"...HEAD \
            | grep -E '\.(c|cc|cpp|h|hpp)$' \
            | grep -vE '^(extern/|src/library/ini/)' || true)
          if [ -z "$files" ]; then
            echo "No non-vendored C/C++ source changes to check."
            exit 0
          fi
          echo "Checking formatting of:"
          echo "$files"
          clang-format --dry-run --Werror $files

  repository-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Select npm 10.9.8
        run: |
          npm install --global npm@10.9.8 --no-audit --no-fund
          test "$(npm --version)" = "10.9.8"
      - name: Install root workspace
        run: npm ci
      - name: Deterministic quality gates
        run: |
          npm run scan:secrets
          npm run test:scan:secrets
          npm run test:clean-checkout
          npm run test:workflow-pins
          npm run test:repository
          npm run check:scripts
          npm run test:versions
          npm run test:release-artifacts
          npm run check:versions
          npm run lint
          npm run typecheck
          npm run check:architecture
          npm run check:hotspots
          npm run test:architecture
          npm run test:capabilities
          npm run check:capabilities

  release-artifact-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.8"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.5.15"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.423"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17.0.20+8"
      - name: Select npm 10.9.8
        run: |
          npm install --global npm@10.9.8 --no-audit --no-fund
          test "$(npm --version)" = "10.9.8"
      - name: Install no-install verifier toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev zlib1g-dev \
            libboost-dev libboost-test-dev libboost-filesystem-dev \
            libboost-iostreams-dev libboost-program-options-dev \
            libboost-system-dev libboost-thread-dev libboost-date-time-dev
      - name: Assemble two clean release-candidate payloads and compare bytes
        run: >-
          node scripts/assemble-release-artifacts.mjs
          --output "$RUNNER_TEMP/licensecc-release-artifacts-a"
          --repeat-output "$RUNNER_TEMP/licensecc-release-artifacts-b"
          --consumer-id release-candidate
