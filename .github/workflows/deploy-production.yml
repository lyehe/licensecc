name: Deploy production Workers

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type deploy-production to authorize the four-Worker rollout
        required: true
        type: string
      backend_url:
        description: Canonical HTTPS URL used for the public-verifier post-deploy drill
        required: true
        type: string
      backup_url:
        description: Canonical HTTPS URL used for the backup post-deploy drill
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: licensecc-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirmation == 'deploy-production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.5.15"
      - name: Select npm 10.9.8
        run: |
          npm install --global npm@10.9.8 --no-audit --no-fund
          test "$(npm --version)" = "10.9.8"
      - name: Install locked workspace
        run: npm ci
      - name: Run deterministic deployment preflight
        run: |
          npm run check:pr
          npm run check:dry-run
      - name: Materialize protected production configuration
        env:
          LICENSECC_BACKEND_WRANGLER_CONFIG_B64: ${{ secrets.LICENSECC_BACKEND_WRANGLER_CONFIG_B64 }}
          LICENSECC_ADMIN_WRANGLER_CONFIG_B64: ${{ secrets.LICENSECC_ADMIN_WRANGLER_CONFIG_B64 }}
          LICENSECC_PORTAL_WRANGLER_CONFIG_B64: ${{ secrets.LICENSECC_PORTAL_WRANGLER_CONFIG_B64 }}
          LICENSECC_BACKUP_WRANGLER_CONFIG_B64: ${{ secrets.LICENSECC_BACKUP_WRANGLER_CONFIG_B64 }}
        run: node scripts/materialize-deploy-configs.mjs
      - name: Build UI assets and validate production bundles
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run build --workspace @licensecc/cloudflare-license-admin
          npm run build --workspace @licensecc/cloudflare-customer-portal
          npx --no-install wrangler deploy --dry-run --config services/cloudflare-licensing-backend/wrangler.toml
          npx --no-install wrangler deploy --dry-run --config services/cloudflare-license-admin/wrangler.jsonc
          npx --no-install wrangler deploy --dry-run --config services/cloudflare-customer-portal/wrangler.jsonc
          npx --no-install wrangler deploy --dry-run --config services/cloudflare-d1-backup/wrangler.jsonc
      - name: Apply backend-owned D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler d1 migrations apply DB --remote --config services/cloudflare-licensing-backend/wrangler.toml
      - name: Deploy backend, admin, portal, and backup Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --no-install wrangler deploy --config services/cloudflare-licensing-backend/wrangler.toml
          npx --no-install wrangler deploy --config services/cloudflare-license-admin/wrangler.jsonc
          npx --no-install wrangler deploy --config services/cloudflare-customer-portal/wrangler.jsonc
          npx --no-install wrangler deploy --config services/cloudflare-d1-backup/wrangler.jsonc
      - name: Run bounded post-deploy drills
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKEND_URL: ${{ inputs.backend_url }}
          BACKUP_URL: ${{ inputs.backup_url }}
        run: |
          npm run validate:public-verifier --workspace @licensecc/cloudflare-licensing-backend -- --url "$BACKEND_URL" --json
          npm run validate:deploy --workspace @licensecc/cloudflare-d1-backup -- --url "$BACKUP_URL" --worker-name licensecc-d1-backup --require-d1-rest-token --json
