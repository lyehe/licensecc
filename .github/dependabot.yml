version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  # The root lockfile owns the complete npm workspace graph.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      npm-workspace:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: "/sdks/python"
    schedule:
      interval: weekly
    groups:
      python-sdk:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: "/services/cloudflare-licensing-backend/scripts/pg-parity"
    schedule:
      interval: weekly
    groups:
      postgres-parity:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: "/sdks/dotnet"
    schedule:
      interval: weekly
    groups:
      dotnet-sdk:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: "/doc"
    schedule:
      interval: weekly
    groups:
      documentation:
        patterns:
          - "*"
