version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  # The root lockfile owns the complete npm workspace graph.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # @types/node tracks the Node major that CI and the Workers tooling run on (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint 10 cannot install until eslint-plugin-import accepts it as a peer
      # (2.32.0 allows eslint up to 9), so the whole group would fail npm ci.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
    groups:
      npm-workspace:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: "/sdks/python"
    schedule:
      interval: weekly
    groups:
      python-sdk:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: "/services/cloudflare-licensing-backend/scripts/pg-parity"
    schedule:
      interval: weekly
    groups:
      postgres-parity:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: "/sdks/dotnet"
    schedule:
      interval: weekly
    groups:
      dotnet-sdk:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: "/doc"
    schedule:
      interval: weekly
    groups:
      documentation:
        patterns:
          - "*"
